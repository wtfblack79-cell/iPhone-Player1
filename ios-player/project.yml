name: iPhonePlayer

options:
  deploymentTarget:
    iOS: "16.0"

targets:
  iPhonePlayer:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes:
          - PlayBookShare
          - PlayBookShare/**
      - path: Assets.xcassets
    dependencies:
      - target: PlayBookShare
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personal.iphoneplayer
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Sources/PlayBook.entitlements
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: PlayBook
        UILaunchScreen: {}
        UIAppFonts:
          - ShantellSans-Regular.ttf
          - ShantellSans-Bold.ttf
          - ShantellSans-Italic.ttf
        UIBackgroundModes:
          - audio
        LSSupportsOpeningDocumentsInPlace: false
        CFBundleURLTypes:
          - CFBundleURLName: com.personal.iphoneplayer
            CFBundleURLSchemes:
              - playbook
        CFBundleDocumentTypes:
          - CFBundleTypeName: Аудиокнига
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes:
              - public.audio
              - public.mp3
              - public.mpeg-4-audio
              - com.apple.m4a-audio
              - com.apple.m4b-audio
              - public.aac-audio
              - com.microsoft.waveform-audio
              - public.aiff-audio
              - com.apple.coreaudio-format
              - org.xiph.flac
          - CFBundleTypeName: FictionBook 2 (FB2)
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes:
              - com.fictionbook.fb2
              - public.xml
          - CFBundleTypeName: Electronic Publication (EPUB)
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes:
              - org.idpf.epub-container
          - CFBundleTypeName: Text
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes:
              - public.plain-text
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.fictionbook.fb2
            UTTypeDescription: FictionBook 2
            UTTypeConformsTo:
              - public.xml
            UTTypeTagSpecification:
              public.filename-extension:
                - fb2


  PlayBookShare:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/PlayBookShare
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personal.iphoneplayer.PlayBookShare
        SWIFT_VERSION: "5.0"
        CODE_SIGN_ENTITLEMENTS: Sources/PlayBookShare/PlayBookShare.entitlements
    info:
      path: Sources/PlayBookShare/PlayBookShare-Info.plist
      properties:
        CFBundleDisplayName: PlayBook
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule: |
              SUBQUERY (
                extensionItems,
                $extensionItem,
                SUBQUERY (
                  $extensionItem.attachments,
                  $attachment,
                  (
                    ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.audio" ||
                    ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.mp3" ||
                    ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.mpeg-4-audio" ||
                    ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "com.apple.m4a-audio" ||
                    ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "com.apple.m4b-audio" ||
                    ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.aac-audio" ||
                    ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "com.microsoft.waveform-audio" ||
                    ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.aiff-audio" ||
                    ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "com.apple.coreaudio-format" ||
                    ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "org.xiph.flac" ||
                    ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "com.fictionbook.fb2" ||
                    ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "org.idpf.epub-container" ||
                    ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.plain-text" ||
                    ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.xml"
                  )
                ).@count > 0
              ).@count > 0
