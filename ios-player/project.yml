
name: iPhonePlayer

options:
  deploymentTarget:
    iOS: "16.0"

targets:
  iPhonePlayer:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes:
          - PlayBookShare
          - PlayBookShare/**
          - PlayBook.entitlements
      - path: Assets.xcassets
    dependencies:
      - target: PlayBookShare
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personal.iphoneplayer
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Sources/PlayBook.entitlements
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: PlayBook
        UILaunchScreen: {}
        UIBackgroundModes:
          - audio
        CFBundleDocumentTypes:
          - CFBundleTypeName: Audio File
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes:
              - public.audio
              - public.mp3
              - public.mpeg-4-audio
              - com.apple.m4a-audio
              - com.microsoft.waveform-audio
              - public.aiff-audio

  PlayBookShare:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/PlayBookShare
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personal.iphoneplayer.PlayBookShare
        SWIFT_VERSION: "5.0"
        CODE_SIGN_ENTITLEMENTS: Sources/PlayBookShare/PlayBookShare.entitlements
    info:
      path: PlayBookShare-Info.plist
      properties:
        CFBundleDisplayName: PlayBook
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule: TRUEPREDICATE
