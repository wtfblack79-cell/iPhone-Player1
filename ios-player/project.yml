name: iPhonePlayer
options:
  deploymentTarget:
    iOS: "16.0"
targets:
  iPhonePlayer:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personal.iphoneplayer
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: PlayBook
        UIBackgroundModes:
          - audio
