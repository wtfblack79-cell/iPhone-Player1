
name: Build iPhone Player

'on':
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios-player
        run: xcodegen generate

      - name: Build for iPhone
        working-directory: ios-player
        run: |
          xcodebuild \
            -project iPhonePlayer.xcodeproj \
            -scheme iPhonePlayer \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Check app icon
        run: |
          APP="ios-player/build/Build/Products/Release-iphoneos/iPhonePlayer.app"
          echo "=== App icon settings ==="
          /usr/libexec/PlistBuddy -c "Print :CFBundleIcons" "$APP/Info.plist" || true
          echo "=== AppIcon in compiled assets ==="
          xcrun --sdk iphoneos assetutil --info "$APP/Assets.car" | grep -i -A 8 -B 4 'AppIcon' || true
          echo "=== Assets.car file ==="
          ls -lh "$APP/Assets.car"

      - name: Package IPA
        working-directory: ios-player
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/iPhonePlayer.app Payload/
          /usr/bin/zip -r iPhonePlayer-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: iPhonePlayer-unsigned
          path: ios-player/iPhonePlayer-unsigned.ipa
