
name: Build iPhone Player

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios-player
        run: xcodegen generate

      - name: Build iOS app
        working-directory: ios-player
        run: |
          xcodebuild \
            -project iPhonePlayer.xcodeproj \
            -scheme iPhonePlayer \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package app
        working-directory: ios-player
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Debug-iphonesimulator/iPhonePlayer.app Payload/
          zip -r iPhonePlayer-simulator.zip Payload

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: iPhonePlayer-simulator
          path: ios-player/iPhonePlayer-simulator.zip
